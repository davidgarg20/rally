<?xml version="1.0" encoding="UTF-8"?>
<!--
  Rally logo v4 — stylized shuttlecock silhouette.
  The shape is unmistakable: round cork base at the top, conical feather
  skirt flaring downward. Tilted ~30° to suggest motion.
  Single solid white silhouette on brand-blue. No internal detail.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#1E88E5"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Shuttlecock, rotated 30° around center for motion -->
  <g transform="rotate(30 256 256)">
    <!-- Cork base (the rounded head at the top) -->
    <circle cx="256" cy="160" r="64" fill="#ffffff"/>

    <!-- Feather skirt: a wide flaring triangle/trapezoid below the cork -->
    <!-- Top edge is narrower than the cork's diameter; bottom is wider -->
    <path
      d="M 208 200
         L 304 200
         L 360 380
         L 152 380
         Z"
      fill="#ffffff"
    />

    <!-- Three feather divider lines, subtle -->
    <g stroke="#1565C0" stroke-width="10" stroke-linecap="round">
      <line x1="232" y1="200" x2="200" y2="370"/>
      <line x1="256" y1="200" x2="256" y2="370"/>
      <line x1="280" y1="200" x2="312" y2="370"/>
    </g>
  </g>
</svg>
