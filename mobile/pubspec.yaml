name: rally
description: "Rally — universal badminton rating."
publish_to: 'none'
version: 0.9.0+9

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.7.0
  go_router: ^14.6.0
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.1.3
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  intl: ^0.19.0
  fl_chart: ^0.69.0
  shared_preferences: ^2.3.2
  share_plus: ^10.1.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/logo_1024.png"
  adaptive_icon_background: "#B8E04A"
  adaptive_icon_foreground: "assets/branding/icon_foreground_1024.png"

flutter_native_splash:
  color: "#FBF7EE"
  image: "assets/branding/lockup_ink.png"
  android_12:
    color: "#FBF7EE"
    image: "assets/branding/lockup_ink.png"
  android: true
  ios: false
  fullscreen: false
