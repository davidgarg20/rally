services:
  - type: web
    name: rally-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /healthz
    envVars:
      - key: ENV
        value: production
      - key: CORS_ORIGINS
        value: https://davidgarg20.github.io
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: INTERNAL_SECRET
        generateValue: true
